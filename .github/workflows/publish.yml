name: publish
on:
  schedule:
    - cron: '0 6 * * *'    # 北京 14:00
    - cron: '30 12 * * *'  # 北京 20:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pull + build
        env:
          APPSHEET_APP_ID: ${{ secrets.APPSHEET_APP_ID }}
          APPSHEET_API_KEY: ${{ secrets.APPSHEET_API_KEY }}
          AGENT_PASSCODES: ${{ secrets.AGENT_PASSCODES }}
        run: |
          node scripts/pull.mjs
          node scripts/build.mjs
      - name: deploy to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "publish-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -q -m "update stock page"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
